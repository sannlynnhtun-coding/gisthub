    <script>
        // Synthesized cues make the outcome of each kind of action recognizable without audio assets.
        window.gistHubSound = (() => {
            const storageKey = 'button-sounds-enabled';
            let context;
            let isListening = false;

            const isEnabled = () => localStorage.getItem(storageKey) !== 'false';
            const setEnabled = (enabled) => window.gistHubBackup.setPreference(storageKey, enabled ? 'true' : 'false');

            const getContext = () => {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return null;

                context ??= new AudioContext();
                if (context.state === 'suspended') {
                    context.resume();
                }
                return context;
            };

            const playTone = (frequency, startOffset, duration, volume, options = {}) => {
                const audio = getContext();
                if (!audio) return;
                const start = audio.currentTime + startOffset;
                const oscillator = audio.createOscillator();
                const gain = audio.createGain();

                oscillator.type = options.waveform ?? 'triangle';
                oscillator.frequency.setValueAtTime(frequency, start);
                oscillator.frequency.exponentialRampToValueAtTime(options.endFrequency ?? frequency * 1.35, start + duration);
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                oscillator.connect(gain).connect(audio.destination);
                oscillator.start(start);
                oscillator.stop(start + duration + 0.02);
            };

            const sounds = {
                default: () => playTone(600, 0, 0.055, 0.045),
                navigate: () => {
                    playTone(420, 0, 0.05, 0.035);
                    playTone(620, 0.04, 0.05, 0.03);
                },
                edit: () => {
                    playTone(520, 0, 0.045, 0.035);
                    playTone(780, 0.03, 0.06, 0.032);
                },
                copy: () => {
                    playTone(720, 0, 0.04, 0.035, { waveform: 'square', endFrequency: 720 });
                    playTone(960, 0.045, 0.055, 0.028, { waveform: 'square', endFrequency: 960 });
                },
                confirm: () => {
                    playTone(500, 0, 0.045, 0.035);
                    playTone(750, 0.035, 0.05, 0.032);
                    playTone(1000, 0.07, 0.07, 0.028);
                },
                dismiss: () => {
                    playTone(580, 0, 0.055, 0.035, { endFrequency: 410 });
                    playTone(390, 0.04, 0.05, 0.025, { endFrequency: 300 });
                },
                destructive: () => {
                    playTone(310, 0, 0.07, 0.035, { waveform: 'sawtooth', endFrequency: 190 });
                    playTone(180, 0.055, 0.07, 0.025, { waveform: 'sawtooth', endFrequency: 120 });
                },
                toggle: (isOn) => {
                    const low = isOn ? 430 : 680;
                    const high = isOn ? 700 : 430;
                    playTone(low, 0, 0.055, 0.035, { endFrequency: low });
                    playTone(high, 0.04, 0.06, 0.03, { endFrequency: high });
                }
            };

            const actionFor = (control) => {
                const explicitAction = control.dataset.sound;
                if (explicitAction && sounds[explicitAction]) return explicitAction;

                const description = [
                    control.getAttribute('aria-label'),
                    control.getAttribute('title'),
                    control.textContent,
                    control.getAttribute('href')
                ].filter(Boolean).join(' ').toLowerCase();

                if (/delete|remove|discard/.test(description)) return 'destructive';
                if (/copy|clone/.test(description)) return 'copy';
                if (/save|create|add|import|login|connect|confirm|retry|sync|load/.test(description)) return 'confirm';
                if (/cancel|close|back|clear|hide/.test(description)) return 'dismiss';
                if (/edit|manage|preview/.test(description)) return 'edit';
                if (control.hasAttribute('aria-pressed') || /toggle|bookmark|favorite/.test(description)) return 'toggle';
                if (control.tagName === 'A' || /open|view|show|go to/.test(description)) return 'navigate';
                return 'default';
            };

            const playAction = (control) => {
                if (!isEnabled()) return;
                const action = actionFor(control);
                if (action === 'toggle') {
                    sounds.toggle(control.getAttribute('aria-pressed') !== 'true');
                    return;
                }
                sounds[action]();
            };

            const playEnabledChime = () => {
                playTone(660, 0, 0.06, 0.045);
                playTone(990, 0.055, 0.08, 0.035);
            };

            const setup = () => {
                if (isListening) return;
                isListening = true;
                document.addEventListener('click', (event) => {
                    if (event.button !== 0) return;
                    if (!(event.target instanceof Element)) return;
                    const control = event.target.closest('button:not(:disabled), a[href], input:not(:disabled)[type="button"], input:not(:disabled)[type="submit"]');
                    if (control && !control.hasAttribute('data-sound-toggle')) playAction(control);
                }, true);
            };

            return { isEnabled, setEnabled, playAction, playEnabledChime, setup };
        })();
    </script>

<body class="bg-background text-foreground transition-colors duration-300">

            An unhandled error has occurred.

    <script src="js/marked.umd.js"></script>
    <script src="js/purify.min.js"></script>
    <script src="js/katex.min.js"></script>
    <script src="js/katex-auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="js/highlight.min.js"></script>
    <script src="js/gistPreview.js"></script>
    <script>
        // Mermaid config
        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        }

        window.highlightCode = (element) => {
            if (element && typeof hljs !== 'undefined') {
                hljs.highlightElement(element);
            } else if (element) {
                // Retry after a small delay if hljs isn't ready
                setTimeout(() => {
                    if (typeof hljs !== 'undefined') {
                        hljs.highlightElement(element);
                    }
                }, 100);
            }
        };

        window.renderMarkdown = async (element, markdownText) => {
            if (!element) return;
            
            if (typeof marked === 'undefined') {
                element.innerText = markdownText;
                return;
            }

            element.innerHTML = marked.parse(markdownText, { breaks: true });

            // Convert fenced Mermaid blocks rendered by marked into Mermaid containers.
            element.querySelectorAll('pre code').forEach((block) => {
                const className = block.className || "";
                const isMermaid = /\blanguage-mermaid\b|\blang-mermaid\b/.test(className);
                if (!isMermaid) return;

                const pre = block.parentElement;
                if (!pre || pre.tagName.toLowerCase() !== 'pre') return;

                const mermaidContainer = document.createElement('div');
                mermaidContainer.className = 'mermaid';
                mermaidContainer.textContent = block.textContent || '';
                pre.replaceWith(mermaidContainer);
            });

            // Initialize mermaid
            if (typeof mermaid !== 'undefined') {
                try {
                    await mermaid.run({
                        nodes: element.querySelectorAll('.mermaid'),
                    });
                } catch (e) {
                    console.error("Mermaid rendering failed", e);
                }
            }
            
            // Highlight code blocks
            element.querySelectorAll('pre code').forEach((block) => {
                window.highlightCode(block);
            });
        };

        window.copyToClipboard = async (text) => {
            // Clipboard access can be denied when focus changes during interop.
            // Return a result so callers never report success for a rejected write.
            if (!document.hasFocus() || !navigator.clipboard?.writeText) {
                return false;
            }
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {
                return false;
            }
        };

        window.downloadTextFile = (filename, text, contentType) => {
            const blob = new Blob([text], { type: contentType || 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        };

        window.openFilePicker = (elementId) => {
            const input = document.getElementById(elementId);
            if (!input) return;
            input.value = '';
            input.click();
        };
    </script>
