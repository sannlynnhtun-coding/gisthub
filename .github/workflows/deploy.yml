name: Deploy GistHub to Vercel

# Controls when the workflow will run
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

# Ensure only one deployment runs at a time to avoid conflicts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the latest code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Initialize .NET Environment
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 2.2 Initialize Node.js Environment (for Tailwind CSS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Handle Dependencies and Build
      - name: Restore & Build
        run: |
          npm install --prefix GistHub
          dotnet restore GistHub.slnx
          dotnet build GistHub.slnx --configuration Release --no-restore

      # 4. Compile the Wasm Project for Production
      - name: Check update notification flow
        run: node scripts/test-app-updates.mjs

      - name: Configure Web Push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: node scripts/configure-web-push.mjs

      - name: Publish GistHub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: dotnet publish GistHub/GistHub.csproj -c Release -o publish_output

      - name: List Output Contents
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: ls -R publish_output

      - name: Copy Vercel Config
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: cp GistHub/vercel.json publish_output/wwwroot/

      # 5. Push to Vercel
      - name: Deploy to Vercel
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        working-directory: ./publish_output/wwwroot
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@52.0.0 deploy --prod --yes

      - name: Notify subscribed browsers after production is live
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          GISTHUB_PUBLIC_URL: ${{ vars.GISTHUB_PUBLIC_URL }}
        run: node scripts/send-update-push.mjs publish_output/wwwroot/service-worker-assets.js
